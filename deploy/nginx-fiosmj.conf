# /etc/nginx/sites-available/fiosmj  (Nginx do host)
# Ativar: ln -s /etc/nginx/sites-available/fiosmj /etc/nginx/sites-enabled/fiosmj
# SSL:    certbot --nginx -d fiosmj.com -d www.fiosmj.com   (adiciona o bloco 443)

limit_req_zone $binary_remote_addr zone=fiosmj_api:10m      rate=30r/m;
limit_req_zone $binary_remote_addr zone=fiosmj_checkout:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fiosmj_contact:10m  rate=5r/m;

upstream fiosmj_app {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name fiosmj.com www.fiosmj.com;

    server_tokens off;
    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* \.(env|git|bak|sql|sh|db)$ { return 404; }

    location /api/checkout/ {
        limit_req zone=fiosmj_checkout burst=5 nodelay;
        proxy_pass http://fiosmj_app;
    }

    location ~ ^/api/(contact|newsletter/subscribe) {
        limit_req zone=fiosmj_contact burst=3 nodelay;
        proxy_pass http://fiosmj_app;
    }

    # Painel e API admin: limite mais apertado contra tentativa de senha
    location ~ ^/(admin|api/admin) {
        limit_req zone=fiosmj_contact burst=20 nodelay;
        proxy_pass http://fiosmj_app;
    }

    location /api/ {
        limit_req zone=fiosmj_api burst=30 nodelay;
        proxy_pass http://fiosmj_app;
    }

    location / {
        proxy_pass http://fiosmj_app;
    }
}
