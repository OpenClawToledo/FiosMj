server.port=8081
# Atrás do Nginx: usa o IP real da visitante (X-Forwarded-For) no limite de tentativas de login
server.forward-headers-strategy=native
spring.application.name=fiosmj-app
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# === CREDENCIAIS — via variáveis de ambiente ===
# Nunca colocar valores reais aqui. Usar .env no servidor.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
# Notificações WhatsApp (opcional). Sem token, ficam desligadas.
openclaw.gateway.url=${OPENCLAW_GATEWAY_URL:http://localhost:18789}
openclaw.gateway.token=${OPENCLAW_GATEWAY_TOKEN:}
notification.maju.phone=${MAJU_PHONE:+553399892409}
notification.toledo.phone=${TOLEDO_PHONE:}

spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/fiosmj.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT — via variável de ambiente obrigatória
jwt.secret=${JWT_SECRET:}
jwt.expiration=604800000

# Admin secret — via variável de ambiente obrigatória
admin.secret=${ADMIN_SECRET:}

# Brevo newsletter
brevo.api.key=${BREVO_API_KEY:}
brevo.list.id=${BREVO_LIST_ID:0}

# Imagens enviadas pelo painel admin
uploads.path=${UPLOADS_PATH:./data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
